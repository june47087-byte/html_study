<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
		<title>블록 레벨과 인라인 레벨</title>
		<style>
			body  * {
				border:1px solid blue;
			}
			.accent {
				color:red;
				font-weight:bold;
			}
		</style>
	</head>
	<body>
		<h1>본래의 문장은 이렇다</h1>
		<div>이렇게 <span class="accent">강조</span>를 할수 있고</div>
		<p>줄바꿈도<br>가능하다. </p>		  
</body>
</html>
